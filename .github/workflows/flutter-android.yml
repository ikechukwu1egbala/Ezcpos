name: EZC Flutter Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  android-build:
    name: Build EZC Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EZC
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/ezcpos_mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Get Flutter dependencies
        working-directory: mobile/ezcpos_mobile
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: mobile/ezcpos_mobile
        run: flutter analyze --no-fatal-infos

      - name: Build Android APK
        working-directory: mobile/ezcpos_mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ezc-pos-debug-apk
          path: mobile/ezcpos_mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
