name: EZC POS Flutter Android CI

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/ezcpos_mobile/**'
      - '.github/workflows/flutter-android.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'mobile/ezcpos_mobile/**'
      - '.github/workflows/flutter-android.yml'

  workflow_dispatch:

concurrency:
  group: ezcpos-flutter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile/ezcpos_mobile

jobs:
  test:
    name: Flutter Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter 3.13.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: stable
          cache: true
          pub-cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter 3.13.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: stable
          cache: true
          pub-cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter project
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk \
            artifacts/ezcpos-debug-${{ github.sha }}.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ezcpos-android-debug-${{ github.sha }}
          path: mobile/ezcpos_mobile/artifacts/ezcpos-debug-${{ github.sha }}.apk
          if-no-files-found: error
          retention-days: 14
